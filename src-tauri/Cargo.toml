[package]
name = "blobbies"
version = "0.1.0"
description = "Blobbies desktop app"
authors = ["Blobbies"]
edition = "2024"
# Matches the toolchain pinned in rust-toolchain.toml. Kept in sync deliberately: a
# lower value makes cargo's MSRV-aware resolver hold back security patches.
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "blobbies_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Capital-B binary so the dev dock name matches the product name.
name = "Blobbies"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# Verifies the pinned checksums of the OCR models build.rs downloads.
sha2 = "0.11.0"

[dependencies]
# `tray-icon` puts Blobbies in the menu bar (src/tray.rs); `image-png` decodes
# the template icon that goes in it.
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
tauri-plugin-http = "2.5.9"
# OS notifications for runs that finish or need the user while the app is
# in the background.
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
# OS-native secret storage (macOS Keychain / Windows Credential Store /
# Linux Secret Service) for the Tinfoil API key — never plaintext JSON.
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
# On-device OCR for images and scanned PDFs. It runs here rather than in the
# webview so that no CSP directive has to be loosened for WebAssembly, and so
# a decoder chewing untrusted bytes sits outside the page holding the user's
# conversations. `image` carries only the formats we accept.
# Text matching and directory walking for the built-in file readers in
# `textutil.rs`. Both already compiled in transitively (via ocrs/tauri), so
# naming them here costs no extra build time and no new supply-chain surface.
regex = { version = "1.13.1", default-features = false, features = [
    "std",
    "perf",
    "unicode-case",
    "unicode-perl",
] }
walkdir = "2.5.0"
ocrs = "0.12.2"
# 0.24, not 0.25: rten 0.25 raised its MSRV to 1.94 and this crate is pinned to
# 1.90 on purpose (see rust-toolchain.toml). ocrs accepts ^0.24, so the older
# line is a supported pairing rather than a downgrade — revisit when the
# toolchain pin moves.
rten = "0.24.0"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
] }
base64 = "0.22.1"

# Screen capture (src/capture.rs) — macOS and Windows only, deliberately not
# Linux. There, xcap captures Wayland through pipewire, a hard (non-optional)
# dependency that needs libpipewire-0.3 at build time and on every user's
# machine. Taking that on would add a system requirement to the .deb and
# AppImage for a feature nobody installs this on Linux for; the tool reports
# itself unavailable there instead.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = "0.9.8"

[lints.rust]
# Deny, not forbid: notifications.rs needs one audited `unsafe` (deref of the
# settings pointer the OS hands its completion block) and `deny` still lets
# a module-level #[expect] mark exactly where and why. Every other file
# stays policed; stray unsafe elsewhere is still an error.
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deny the patterns that turn into runtime panics in a shipped desktop app.
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "deny"
dbg_macro = "deny"

# Real UNUserNotificationCenter authorization and sending for notifications
# (src/notifications.rs): the plugin never asks macOS for permission, and its
# send path uses the deprecated NSUserNotification API, which modern macOS
# silently drops. Versions match what Tauri already pins in the lock
# (objc2 0.6 / objc2-* 0.3 family).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-user-notifications = { version = "0.3.2", features = [
  "UNUserNotificationCenter",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationSettings",
  "UNNotificationSound",
  "block2",
] }
block2 = "0.6.2"

[profile.dev]
incremental = true

# Optimize dependencies even in dev builds. OCR is number crunching in `ocrs`,
# `rten` and `image`, and unoptimized it runs ~30x slower — measured on one
# 800x229 image: 4.4s debug, 150ms release. Our own crate stays unoptimized, so
# incremental rebuilds and backtraces are unaffected; only the first build after
# a clean checkout pays for this.

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
