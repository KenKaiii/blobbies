name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage

      # Never built in CI before: the vite bundle and the size budget gate
      # that `tauri build` depends on, so a regression here only surfaced at
      # release time.
      - run: pnpm build

  # The Rust crate carries `#[cfg(windows)]` and `#[cfg(target_os = "macos")]`
  # branches (Ollama/Composio detection, keyring). Compiling on Linux alone
  # never type-checks them, so a Windows breakage shipped until a Windows
  # user hit it. Clippy --all-targets compiles every cfg path; the tests that
  # are OS-specific (symlink escape, keychain) are already cfg-gated inside.
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows compiles the whole tree cold in ~20 min; 45 leaves headroom
    # without letting a wedged runner burn the whole hour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux webkit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Installs the exact toolchain + components pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

      # Toolchain first: rust-cache keys on the active rustc version.
      - run: rustup show active-toolchain || rustup toolchain install

      # Caches ~/.cargo/bin (cache-bin defaults true), so the cargo-audit build below
      # is a no-op on subsequent runs. cache-all-crates keeps its deps too, since
      # cargo-audit is CI tooling rather than a dependency of this crate.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-all-crates: true
          cache-targets: false

      # Licence attribution must never drift from the installed tree: the
      # generator fails on UNKNOWN licences, and a stale committed notices
      # file fails the diff.
      - run: node scripts/generate-notices.mjs
      - run: git diff --exit-code THIRD-PARTY-NOTICES.md

      # --locked on purpose: rustsec/audit-check installs cargo-audit unlocked, which
      # resolves newest transitive deps and broke on the rustc version pinned in
      # rust-toolchain.toml. --locked uses cargo-audit's own lockfile.
      - run: cargo install --locked cargo-audit
      - run: cargo audit
        working-directory: src-tauri

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Full history: this repo ships publicly, so every commit is public the
      # moment it lands on main — the scan must see all of them, not just the
      # tip. The pre-commit hooks and GitHub push protection guard the write;
      # this re-audits the whole history on every push and PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Pinned release, checksum-verified, rather than gitleaks-action: the
      # wrapper needs a license for orgs and is another action in the supply
      # chain. Bump the version here and in all four URLs together.
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          curl -fsSL -o gitleaks_8.30.1_linux_x64.tar.gz "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL "$base/gitleaks_8.30.1_checksums.txt" | grep 'gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks

      # --redact so a real finding never prints the secret into the Actions log.
      - run: gitleaks git --redact .
