name: Release build

# Produces the per-OS installers and attaches them, with SHA-256 checksums,
# to a draft GitHub Release. Triggered by pushing a `v*` tag — see
# .github/RELEASING.md for the process and the optional signing secrets.
#
# macOS builds are signed with a Developer ID certificate and notarized
# (secrets configured 2026-08-20; verified with spctl + stapler on the
# shipped dmg). Windows builds are still unsigned — SmartScreen shows until
# the WINDOWS_* secrets land; every signing step is conditional on its
# secret being present, so the workflow never breaks for lack of one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every entry passes --target explicitly, so cargo always writes to
          # target/<triple>/release/bundle — native builds included (a native
          # --target run does NOT use plain target/release; measured).
          - name: macOS arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            arch: aarch64
            # "app" is required for the updater artifact: with dmg alone Tauri
            # skips the .app.tar.gz + .sig the in-app updater downloads.
            bundles: app,dmg
            bundle-dir: src-tauri/target/aarch64-apple-darwin/release/bundle
          - name: macOS x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            arch: x64
            bundles: app,dmg
            bundle-dir: src-tauri/target/x86_64-apple-darwin/release/bundle
          - name: Linux x64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            bundle-dir: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          - name: Windows x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis
            bundle-dir: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
    runs-on: ${{ matrix.os }}
    # Booleans only: an unset secret interpolates to an empty string, and a
    # job-level `APPLE_CERTIFICATE: ""` is enough for Tauri's bundler to try
    # (and fail) importing it — measured on the first v0.1.0 run. So the probe
    # names differ from anything Tauri reads; the real values move through
    # step env and GITHUB_ENV in the import steps below.
    env:
      APPLE_CERT_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' }}
      WIN_CERT_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Linux webkit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libfuse2t64: AppImage tooling (linuxdeploy) needs FUSE 2, which
          # ubuntu-24.04 dropped; renamed from libfuse2 there.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2t64

      # Installs the exact toolchain pinned in rust-toolchain.toml (proven
      # order: `show` auto-installs from the toml on newer rustup, and falls
      # back to an explicit install on older).
      - run: rustup show active-toolchain || rustup toolchain install
        shell: bash
      - run: rustup target add ${{ matrix.rust-target }}
        shell: bash

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERT_CONFIGURED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          # Export what Tauri's bundler reads: the identity, and the
          # notarization credentials. GITHUB_ENV reaches the build step as a
          # real environment variable, present only when signing is on.
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then echo "no Developer ID Application identity found"; exit 1; fi
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WIN_CERT_CONFIGURED == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: bash
        run: |
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > certificate.pfx
          pwsh -Command '
            Import-PfxCertificate -FilePath certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)'
          rm certificate.pfx
          echo "WIN_CERT_THUMBPRINT=$WINDOWS_CERTIFICATE_THUMBPRINT" >> "$GITHUB_ENV"

      # bash on every OS so the comma bundle list and the conditional signing
      # config compose the same way. The thumbprint override reaches Tauri via
      # --config rather than tauri.conf.json, so no secret-shaped value is
      # ever committed. TAURI_SIGNING_PRIVATE_KEY makes the bundler emit the
      # .sig files the in-app updater verifies against the pubkey in
      # tauri.conf.json.
      - name: Build bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # GitHub sets CI=true, which makes the DMG bundler pass --skip-jenkins
          # and silently drop the background/icon layout. GH-hosted macOS runners
          # do have a GUI session, so force the Finder AppleScript to run.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          set -euo pipefail
          args=(--bundles "${{ matrix.bundles }}")
          if [[ "${{ runner.os }}" == "Windows" && -n "${WIN_CERT_THUMBPRINT:-}" ]]; then
            args+=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$WIN_CERT_THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.comodoca.com\"}}}")
          fi
          pnpm tauri build --target ${{ matrix.rust-target }} "${args[@]}"

      # Flatten before upload: with the nested glob paths upload-artifact
      # preserves the dmg/deb/nsis subdirectories, and the release job's
      # shasum would hit directories. One flat dir per artifact keeps the
      # release assets flat, and Tauri already puts the arch in each filename
      # (…_aarch64.dmg, …_x64-setup.exe) so nothing collides on merge.
      #
      # Updater artifacts ride along: the .app.tar.gz (+.sig) the macOS
      # updater downloads (not the dmg), and .sig for the AppImage and the
      # NSIS setup exe. Missing .sig means the build ran without the signing
      # key — caught here rather than as a client that silently can't update.
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # nullglob makes this OS's missing bundle types vanish entirely,
          # so a plain `cp <glob> out/` would become `cp out/` — hence the
          # per-file loop with an existence check.
          shopt -s nullglob
          for file in \
            ${{ matrix.bundle-dir }}/dmg/*.dmg \
            ${{ matrix.bundle-dir }}/deb/*.deb \
            ${{ matrix.bundle-dir }}/appimage/*.AppImage \
            ${{ matrix.bundle-dir }}/appimage/*.AppImage.sig \
            ${{ matrix.bundle-dir }}/nsis/*-setup.exe \
            ${{ matrix.bundle-dir }}/nsis/*-setup.exe.sig \
            ${{ matrix.bundle-dir }}/macos/*.app.tar.gz \
            ${{ matrix.bundle-dir }}/macos/*.app.tar.gz.sig; do
            cp "$file" out/
          done
          # The macOS updater artifact comes out as plain Blobbies.app.tar.gz
          # (no version, no arch), which would collide between the two macOS
          # jobs and does not match the manifest's expected names. Version is
          # read off the dmg already in out/ so workflow_dispatch from a
          # branch ref cannot misname it.
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ver=$(ls out/*.dmg | sed -E 's/.*_([0-9]+\.[0-9]+\.[0-9]+)_.*/\1/' | head -1)
            mv "out/Blobbies.app.tar.gz" "out/Blobbies_${ver}_${{ matrix.arch }}.app.tar.gz"
            mv "out/Blobbies.app.tar.gz.sig" "out/Blobbies_${ver}_${{ matrix.arch }}.app.tar.gz.sig"
          fi
          ls -l out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blobbies-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # Everything above uploads artifacts; this job turns them into the thing
  # users download: a draft Release carrying every installer plus a checksum
  # file. Runs only for real tag pushes (workflow_dispatch still gets the
  # artifacts on the run page for testing).
  release:
    name: Draft GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # download pinned to the same major as upload-artifact: v8's new
      # digest verification (digest-mismatch: error by default) fails on
      # artifacts uploaded moments earlier by v7 — measured. Same-major pair
      # avoids the cross-major metadata mismatch; SHA256SUMS below still gives
      # users an integrity check at download time.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksum installers
        run: cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The updater's endpoint: releases/latest/download/latest.json. Written
      # after checksumming so SHA256SUMS covers installers only, then uploaded
      # with the rest.
      - name: Write updater manifest
        run: node scripts/update-manifest.mjs dist "${TAG_NAME}"
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          # Belt-and-braces: YAML strips the block's common indent, so the
          # heredoc arrives unindented — but if the content ever gains extra
          # indentation, GitHub would render the table as a code block. Strip
          # leading whitespace defensively.
          cat > preamble.md <<EOF
          **Which file do I download?**

          | Your system | File |
          | --- | --- |
          | macOS — Apple Silicon (M1–M4) | \`Blobbies_${VER}_aarch64.dmg\` |
          | macOS — Intel | \`Blobbies_${VER}_x64.dmg\` |
          | Windows | \`Blobbies_${VER}_x64-setup.exe\` |
          | Linux — Debian/Ubuntu | \`Blobbies_${VER}_amd64.deb\` |
          | Linux — any distro | \`Blobbies_${VER}_amd64.AppImage\` |

          The Windows build is unsigned for now, so SmartScreen asks on first
          run — "More info → Run anyway". macOS builds are signed and notarized.

          After installing, the app updates itself. The remaining files are how
          it does that.
          EOF
          sed 's/^[[:space:]]*//' preamble.md > release-notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "Blobbies $TAG" \
              --notes-file release-notes.md dist/*
          fi
